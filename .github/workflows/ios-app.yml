# BrainBloom Kids: builds the iPhone/iPad app on GitHub's Mac computers
# and uploads it to App Store Connect (TestFlight). No Mac needed.
#
# Put this file in your repo at:  .github/workflows/ios-app.yml
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   10-character Team ID from developer.apple.com > Membership
#   BUNDLE_ID       the app's ID, for example com.yourname.brainbloomkids
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      full text of the AuthKey_XXXX.p8 file (including BEGIN/END lines)
# Also needs app-icon.png (1024x1024) and app-splash.png (2732x2732) next to index.html.

name: Build iPhone app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number shown on the App Store (for example 1.0)"
        required: true
        default: "1.0"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RAW_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      RAW_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      RAW_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      VER: ${{ inputs.version }}
      BUILD: ${{ github.run_number }}
      PROFILE_NAME: BrainBloom CI ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        run: |
          # Remove any spaces or line breaks pasted into the secrets by accident
          clean() { printf '%s' "$1" | tr -d ' \t\r\n'; }
          BUNDLE_ID=$(clean "$RAW_BUNDLE_ID"); TEAM=$(clean "$RAW_TEAM"); KEY_ID=$(clean "$RAW_KEY_ID"); ISSUER=$(clean "$RAW_ISSUER")
          missing=""
          [ -z "$BUNDLE_ID" ] && missing="$missing BUNDLE_ID"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
          for f in index.html app-icon.png app-splash.png; do [ -f "$f" ] || { echo "::error::$f is missing from the repo"; exit 1; }; done
          echo "Building BrainBloom Kids $VER (build $BUILD) for $BUNDLE_ID"
          if ! printf '%s' "$BUNDLE_ID" | grep -Eq '^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z0-9-]+)+$'; then
            echo "::error::BUNDLE_ID should look like com.yourname.brainbloomkids (letters, numbers, dots and dashes only)."; exit 1
          fi
          # Capacitor does not allow dashes in its own ID; the real bundle ID is set later in the Xcode project
          CAP_ID=$(printf '%s' "$BUNDLE_ID" | tr '-' '_')
          { echo "BUNDLE_ID=$BUNDLE_ID"; echo "TEAM=$TEAM"; echo "KEY_ID=$KEY_ID"; echo "ISSUER=$ISSUER"; echo "CAP_ID=$CAP_ID"; } >> "$GITHUB_ENV"
          echo "SIGN_DIR=$RUNNER_TEMP/sign" >> "$GITHUB_ENV"

      - name: Pick the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Create the native iOS project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          cat > package.json <<'EOF'
          {"name":"brainbloom-kids","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/core":"^7.0.0","@capacitor/ios":"^7.0.0","@capacitor/haptics":"^7.0.0"},
           "devDependencies":{"@capacitor/cli":"^7.0.0"}}
          EOF
          cat > capacitor.config.json <<EOF
          {"appId":"$CAP_ID","appName":"BrainBloom Kids","webDir":"www",
           "ios":{"contentInset":"never","backgroundColor":"#B9E5FF","scrollEnabled":false}}
          EOF
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Bundle the fonts inside the app (no outside requests)
        run: |
          mkdir -p app/www/fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          ok=1
          curl -fsSL -o app/www/fonts/LilitaOne.ttf "$G/lilitaone/LilitaOne-Regular.ttf" || ok=0
          curl -fsSL -o app/www/fonts/Nunito.ttf "$G/nunito/Nunito%5Bwght%5D.ttf" || ok=0
          curl -fsSL -o app/www/fonts/OFL-LilitaOne.txt "$G/lilitaone/OFL.txt" || true
          curl -fsSL -o app/www/fonts/OFL-Nunito.txt "$G/nunito/OFL.txt" || true
          OK=$ok python3 - <<'EOF'
          import os,re
          p='app/www/index.html'; h=open(p,encoding='utf-8').read()
          h=re.sub(r'<link[^>]*fonts\.(googleapis|gstatic)\.com[^>]*>\s*','',h)
          if os.environ['OK']=='1':
              ff=("<style>@font-face{font-family:'Lilita One';src:url(fonts/LilitaOne.ttf) format('truetype');font-display:swap}"
                  "@font-face{font-family:'Nunito';src:url(fonts/Nunito.ttf) format('truetype');font-weight:200 1000;font-display:swap}</style>\n")
              h=h.replace('</head>',ff+'</head>',1)
              print('Fonts bundled.')
          else:
              print('::warning::Could not download fonts; the app will use the system font.')
          assert 'fonts.googleapis' not in h
          open(p,'w',encoding='utf-8').write(h)
          EOF
          npx cap copy ios

      - name: Add icon, launch screen and app settings
        run: |
          A=app/ios/App/App/Assets.xcassets
          rm -rf "$A/AppIcon.appiconset"; mkdir -p "$A/AppIcon.appiconset"
          cp app-icon.png "$A/AppIcon.appiconset/icon-1024.png"
          cat > "$A/AppIcon.appiconset/Contents.json" <<'EOF'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          for f in "$A"/Splash.imageset/*.png; do cp app-splash.png "$f"; done
          P=app/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BrainBloom" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string BrainBloom" "$P"
          # Portrait only on iPhone and iPad; full screen on iPad
          for k in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do /usr/libexec/PlistBuddy -c "Delete :$k" "$P" 2>/dev/null || true; done
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$P"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarStyle" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleDarkContent" "$P"
          cat > /tmp/settings.rb <<'EOF'
          require 'xcodeproj'
          p = Xcodeproj::Project.open('app/ios/App/App.xcodeproj')
          p.targets.select { |t| t.name == 'App' }.each do |t|
            t.build_configurations.each do |c|
              s = c.build_settings
              s['DEVELOPMENT_TEAM'] = ENV['TEAM']
              s['CODE_SIGN_STYLE'] = 'Manual'
              s['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              s['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              s['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
              s['PRODUCT_BUNDLE_IDENTIFIER'] = ENV['BUNDLE_ID']
              s['MARKETING_VERSION'] = ENV['VER']
              s['CURRENT_PROJECT_VERSION'] = ENV['BUILD']
              s['TARGETED_DEVICE_FAMILY'] = '1,2'
              s['ASSETCATALOG_COMPILER_APPICON_NAME'] = 'AppIcon'
            end
          end
          p.save
          EOF
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby /tmp/settings.rb

      - name: App Store Connect key
        run: |
          mkdir -p ~/private_keys
          F=~/private_keys/AuthKey_$KEY_ID.p8
          # Rebuild the key file, whatever way it was pasted (missing lines, extra spaces, Windows line endings)
          BODY=$(printf '%s' "$P8" | tr -d '\r' | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$F"
          if ! openssl pkey -in "$F" -noout 2>/dev/null && ! openssl ec -in "$F" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_P8 secret is not a valid Apple key. Open the AuthKey_${KEY_ID}.p8 file, copy ALL of its text and save it again as the ASC_KEY_P8 secret."
            exit 1
          fi
          echo "Apple key looks good (${#BODY} characters)."

      - name: Check Apple login
        run: |
          cat > /tmp/check.rb <<'EOF'
          require 'openssl'; require 'json'; require 'base64'; require 'net/http'; require 'uri'
          kid=ENV['KEY_ID'].to_s.strip; iss=ENV['ISSUER'].to_s.strip; bid=ENV['BUNDLE_ID'].to_s.strip
          key=OpenSSL::PKey.read(File.read(ENV['KEYFILE']))
          b64=->(s){ Base64.urlsafe_encode64(s, padding: false) }
          now=Time.now.to_i
          data=b64.({alg:'ES256',kid:kid,typ:'JWT'}.to_json)+'.'+b64.({iss:iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'}.to_json)
          der=key.sign(OpenSSL::Digest::SHA256.new, data)
          seq=OpenSSL::ASN1.decode(der)
          sig=seq.value.map{|i| i.value.to_s(2).rjust(32,"\0")}.join
          jwt=data+'.'+b64.(sig)
          problems=[]
          problems << "ASC_KEY_ID should be 10 letters and numbers (it has #{kid.length} characters)." unless kid =~ /\A[A-Z0-9]{10}\z/
          problems << "ASC_ISSUER_ID should look like 12345678-abcd-1234-abcd-123456789012 (it has #{iss.length} characters)." unless iss =~ /\A\h{8}-\h{4}-\h{4}-\h{4}-\h{12}\z/
          problems << "BUNDLE_ID has spaces or unusual characters." unless bid =~ /\A[A-Za-z0-9.\-]+\z/
          problems.each{|p| puts "::error::#{p}"}
          uri=URI("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=#{bid}&limit=5")
          req=Net::HTTP::Get.new(uri); req['Authorization']="Bearer #{jwt}"
          res=Net::HTTP.start(uri.host,uri.port,use_ssl:true){|h| h.request(req)}
          case res.code
          when '200'
            ids=JSON.parse(res.body)['data'].map{|d| d['attributes']['identifier']}
            if ids.include?(bid) then puts "Apple login works, and the App ID #{bid} is registered."
            else puts "::error::Apple login works, but the App ID in BUNDLE_ID is not registered at developer.apple.com > Identifiers (or BUNDLE_ID has a typo)."; exit 1 end
          when '401'
            puts "::error::Apple rejected the login (401). ASC_KEY_ID and ASC_ISSUER_ID must come from the same Team Keys page as the AuthKey file. Check that ASC_KEY_ID matches the file name AuthKey_XXXXXXXXXX.p8, and copy the Issuer ID again."; exit 1
          when '403'
            puts "::error::Apple login works, but this key is not allowed to do this (403). Make a Team Key with Admin access and update ASC_KEY_ID and ASC_KEY_P8."; exit 1
          else
            puts "::error::Unexpected answer from Apple (#{res.code}): #{res.body[0,300]}"; exit 1
          end
          exit 1 unless problems.empty?
          EOF
          KEYFILE=~/private_keys/AuthKey_$KEY_ID.p8 ruby /tmp/check.rb

      - name: Make App Store signing files
        run: |
          KEYFILE=~/private_keys/AuthKey_$KEY_ID.p8 ruby .github/scripts/asc.rb setup
          cd "$SIGN_DIR"
          KC="$SIGN_DIR/build.keychain-db"; KP=$(openssl rand -hex 12); PP=$(openssl rand -hex 12)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import wwdr.cer -k "$KC" -T /usr/bin/codesign || true
          openssl x509 -inform DER -in dist.cer -out dist.pem
          openssl pkcs12 -export -legacy -inkey dist.key -in dist.pem -out dist.p12 -passout pass:$PP 2>/dev/null || openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout pass:$PP
          security import dist.p12 -k "$KC" -P "$PP" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KC"
          UUID=$(cat profile_uuid)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; cp app.mobileprovision "$d/$UUID.mobileprovision"; done
          rm -f dist.key dist.p12
          echo "Signing files are ready."

      - name: Build the app
        run: |
          cd app/ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BrainBloom.xcarchive" \
            archive > "$RUNNER_TEMP/build.log" 2>&1 || true
          tail -n 200 "$RUNNER_TEMP/build.log"
          grep -E "error:|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::$l"; done
          test -d "$RUNNER_TEMP/BrainBloom.xcarchive" || { echo "::error::Build failed. Scroll up for the first error."; exit 1; }

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BrainBloom.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded BrainBloom Kids $VER (build $BUILD). It appears in App Store Connect > TestFlight in about 15-30 minutes."

      - name: Remove temporary signing files
        if: always()
        run: |
          if [ -f ~/private_keys/AuthKey_$KEY_ID.p8 ] && [ -n "$SIGN_DIR" ]; then KEYFILE=~/private_keys/AuthKey_$KEY_ID.p8 ruby .github/scripts/asc.rb cleanup || true; fi
          [ -n "$SIGN_DIR" ] && security delete-keychain "$SIGN_DIR/build.keychain-db" 2>/dev/null || true

      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
