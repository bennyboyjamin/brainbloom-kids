<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainBloom Kids</title>
<meta name="theme-color" content="#B9E5FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   BrainBloom Kids design system
   Palette: sky #B9E5FF · lavender #BFA7FF · mint #A8EDCF · peach #FFC6A5 · sun #FFD95A · navy #272044
   Type: Lilita One (display) + Nunito (UI/body)
   ========================================================= */
:root{
 --sky:#B9E5FF;--lav:#BFA7FF;--mint:#A8EDCF;--peach:#FFC6A5;--sun:#FFD95A;--navy:#272044;
 --ink:#272044;--ink2:#5E5888;--card:#FFFFFF;--card2:#F8F6FF;--line:rgba(39,32,68,.09);--soft:#F1EDFF;
 --brand:#6E50F0;
 --sh1:0 1px 0 rgba(39,32,68,.04),0 10px 26px rgba(39,32,68,.10);
 --sh2:0 2px 0 rgba(39,32,68,.05),0 18px 40px rgba(39,32,68,.16);
 --hi:inset 0 2px 0 rgba(255,255,255,.9);
 --r1:30px;--r2:24px;--r3:16px;
 --f-d:'Lilita One','Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
 --f-u:'Nunito','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
 --bg1:#B9E5FF;--bg2:#DDF0FF;--bg3:#F0EBFF;--bg4:#FFF2E8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F4F1FF;--ink2:#BDB6E4;--card:#2B2453;--card2:#2F285C;--line:rgba(255,255,255,.08);--soft:#3A3170;--sh1:0 10px 26px rgba(0,0,0,.35);--sh2:0 18px 40px rgba(0,0,0,.45);--hi:inset 0 1px 0 rgba(255,255,255,.07);--bg1:#1C1745;--bg2:#221B50;--bg3:#291F57;--bg4:#30244F}}
:root[data-theme="dark"]{--ink:#F4F1FF;--ink2:#BDB6E4;--card:#2B2453;--card2:#2F285C;--line:rgba(255,255,255,.08);--soft:#3A3170;--sh1:0 10px 26px rgba(0,0,0,.35);--sh2:0 18px 40px rgba(0,0,0,.45);--hi:inset 0 1px 0 rgba(255,255,255,.07);--bg1:#1C1745;--bg2:#221B50;--bg3:#291F57;--bg4:#30244F}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg1);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--f-u);font-weight:700;color:var(--ink);line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
 background:radial-gradient(130px 56px at 12% 8%,rgba(255,255,255,.7),transparent 70%),radial-gradient(170px 70px at 88% 20%,rgba(255,255,255,.55),transparent 70%),radial-gradient(240px 90px at 18% 58%,rgba(255,255,255,.3),transparent 70%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 26%,var(--bg3) 64%,var(--bg4) 100%);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #FFB020;outline-offset:3px}
h1,h2,h3{font-family:var(--f-d);font-weight:400;letter-spacing:.3px;margin:0;line-height:1.1}
p{margin:0}
#app{max-width:820px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px))}
.ic,.icc{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.center{text-align:center}
.note{font-size:13.5px;color:var(--ink2);line-height:1.45;font-weight:700}
.muted{color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.lead{color:var(--ink2);font-weight:800;margin:2px 4px 6px}

/* ---------- buttons ---------- */
.btn{--b1:#A08BFF;--b2:#6E50F0;--bd:#4E31C4;--bt:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:var(--f-d);font-size:19px;letter-spacing:.3px;color:var(--bt);border-radius:18px;padding:12px 22px;background:linear-gradient(180deg,var(--b1),var(--b2));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 var(--bd),0 10px 18px rgba(39,32,68,.18);transition:transform .12s,box-shadow .12s;touch-action:manipulation;position:relative;text-shadow:0 1px 0 rgba(0,0,0,.12);text-decoration:none}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 var(--bd),0 3px 6px rgba(39,32,68,.15)}
.btn.sun{--b1:#FFEA94;--b2:#FFC83A;--bd:#DB9C00;--bt:#272044;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.mint,.btn.green{--b1:#8CF0C4;--b2:#2FC584;--bd:#1A925C;--bt:#fff}
.btn.ghost{--b1:#FFFFFF;--b2:#F2EFFF;--bd:#D7CFF5;--bt:#272044;text-shadow:none}
.btn.red{--b1:#FF97A8;--b2:#F0435F;--bd:#B5243F}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:14px;gap:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 var(--bd),0 6px 10px rgba(39,32,68,.14)}
.btn.sm:active{transform:translateY(2px)}
.btn.big{font-size:23px;padding:16px 22px;border-radius:22px}
.btn.block{display:flex;width:100%}
.btn .ic{width:1.05em;height:1.05em}
.btn:disabled{opacity:.5;pointer-events:none}
.link{border:0;background:none;color:var(--brand);font-weight:900;font-size:15px;cursor:pointer;padding:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#B9A6FF}}

/* ---------- surfaces ---------- */
.card{background:linear-gradient(180deg,var(--card),var(--card2));border-radius:var(--r2);padding:16px;box-shadow:var(--hi),var(--sh1);margin:12px 0}
.card .ch{font-size:21px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px 5px 7px;font-weight:900;font-size:16px;box-shadow:var(--hi),0 3px 10px rgba(39,32,68,.1);white-space:nowrap}
.pill .icc{width:22px;height:22px}
.pill.bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
.bar,.m-bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;box-shadow:inset 0 2px 3px rgba(39,32,68,.1)}
.bar i,.m-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#8CF0C4,#2FC584);box-shadow:inset 0 2px 0 rgba(255,255,255,.45);animation:barin 1s cubic-bezier(.3,1,.4,1) backwards}
.m-bar{margin-top:6px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:24px 4px 10px}
.sect h2{font-size:24px}
.sect small{font-size:14px;font-weight:800;color:var(--ink2)}
.pagehead{margin:8px 4px 2px}
.pagehead h1{font-size:32px}
.warn{background:#FFF1C2;color:#6B4A00;border-radius:16px;padding:10px 14px;font-weight:800;font-size:13.5px;margin:0 0 10px;display:flex;gap:8px;align-items:flex-start}
.disclaimer{font-size:12.5px;color:var(--ink2);text-align:center;margin:26px 8px 0;line-height:1.5;font-weight:700}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.logo{display:flex;align-items:center;gap:7px;min-width:0}
.mark{width:42px;height:42px;flex:none;filter:drop-shadow(0 3px 4px rgba(39,32,68,.18))}
.lg-name{font-family:var(--f-d);font-size:27px;color:var(--ink);letter-spacing:.3px;white-space:nowrap}
.lg-tag,.lg-par{font-family:var(--f-d);font-size:15px;color:#fff;border-radius:10px;padding:2px 9px;transform:rotate(-6deg);display:inline-block;white-space:nowrap}
.lg-tag{background:linear-gradient(180deg,#FF9FCB,#FF5FA2);box-shadow:0 3px 0 #D93F82}
.lg-par{background:linear-gradient(180deg,#8CF0C4,#2FC584);box-shadow:0 3px 0 #1A925C}
.tb-right{display:flex;align-items:center;gap:8px}
.iconbtn{width:46px;height:46px;border-radius:16px;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--hi),0 4px 12px rgba(39,32,68,.12);color:var(--ink);transition:transform .12s}
.iconbtn:active{transform:scale(.92)}
.iconbtn .ic{width:24px;height:24px}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--card);border-radius:999px;padding:8px 16px 8px 10px;font-weight:900;cursor:pointer;box-shadow:var(--hi),0 3px 10px rgba(39,32,68,.1);color:var(--ink)}
.backbtn .ic{width:20px;height:20px}

/* ---------- player card ---------- */
.player{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;padding:14px 16px;margin-top:0}
.avatar{width:66px;height:66px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font-size:36px;cursor:pointer;position:relative;flex:none;box-shadow:inset 0 -5px 8px rgba(0,0,0,.12),0 0 0 4px #fff,0 6px 14px rgba(39,32,68,.2);transition:transform .15s}
.avatar:active{transform:scale(.94)}
.aved{position:absolute;right:-5px;bottom:-5px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#A08BFF,#6E50F0);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.aved .ic{width:14px;height:14px}
.pinfo{min-width:0}
.pname{font-family:var(--f-d);font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{display:flex;align-items:center;gap:8px;margin:3px 0 7px}
.lvbadge{background:linear-gradient(180deg,#B9A6FF,#7B5CFF);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900}
.xptxt{font-size:13px;color:var(--ink2);font-weight:900}
.xpbar{height:14px;border-radius:999px;background:var(--soft);box-shadow:inset 0 2px 4px rgba(39,32,68,.12);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#CFC1FF,#7B5CFF 60%,#6343E6);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width 1.2s cubic-bezier(.3,1,.4,1);position:relative}
.xpbar i::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:sheen 2.8s ease-in-out infinite}
.pstats{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- scenes (rooms) ---------- */
.room-cozy{--rc:#FFE0C7;--rc2:#FFB08A;--rf:#E0946A}.room-ocean{--rc:#C4F0FF;--rc2:#6CC6F2;--rf:#3E9ACB}.room-forest{--rc:#CFF6DA;--rc2:#71D69A;--rf:#3AA567}.room-candy{--rc:#FCDDF6;--rc2:#E3A1F0;--rf:#BE76D3}.room-sunset{--rc:#FFE8B0;--rc2:#FF9C76;--rf:#D96B57}.room-space{--rc:#5A55C8;--rc2:#2A2580;--rf:#1B1858}
.scene{background:radial-gradient(85% 70% at 16% 0%,rgba(255,250,232,.7),transparent 60%),linear-gradient(112deg,transparent 26%,rgba(255,255,255,.18) 26% 38%,transparent 38% 46%,rgba(255,255,255,.1) 46% 52%,transparent 52%),radial-gradient(55% 14% at 30% 100%,rgba(0,0,0,.18),transparent 70%),linear-gradient(180deg,transparent 70%,var(--rf,#E0946A) 70%,color-mix(in srgb,var(--rf,#E0946A) 82%,#000) 100%),linear-gradient(180deg,var(--rc,#FFE0C7),var(--rc2,#FFB08A) 70%)}
.scene.room-space{background:radial-gradient(#fff 1.3px,transparent 2px) 0 0/34px 34px,radial-gradient(#FFE27A 1.3px,transparent 2px) 17px 11px/53px 53px,radial-gradient(85% 70% at 16% 0%,rgba(180,170,255,.45),transparent 60%),linear-gradient(180deg,transparent 70%,#1B1858 70%),linear-gradient(180deg,#5A55C8,#2A2580 70%)}

/* ---------- companion ---------- */
.comp{position:relative;border-radius:var(--r1);padding:14px 14px 14px 8px;display:grid;grid-template-columns:minmax(118px,40%) 1fr;gap:8px;align-items:center;overflow:hidden;min-height:196px;margin:12px 0;box-shadow:var(--sh2)}
.comp-bud{cursor:pointer;position:relative;z-index:1;touch-action:manipulation}
.comp-side{display:flex;flex-direction:column;gap:8px;min-width:0;z-index:1;align-items:flex-start}
.comp-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comp-name b{font-family:var(--f-d);font-weight:400;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(39,32,68,.35),0 0 14px rgba(39,32,68,.45)}
.stagechip{background:rgba(255,255,255,.88);color:#272044;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.bubble{background:#fff;color:#272044;border-radius:18px;padding:10px 13px;font-size:15.5px;font-weight:800;position:relative;box-shadow:0 6px 16px rgba(39,32,68,.18);animation:bubblein .45s cubic-bezier(.3,1.5,.5,1);cursor:pointer}
.comp .bubble::before{content:'';position:absolute;left:-7px;top:16px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.comp-actions{display:flex;gap:6px;flex-wrap:wrap}
.comp-actions .btn{font-size:14px;padding:7px 12px}

/* ---------- daily quest ---------- */
.quest{padding:16px;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 100% 0%,rgba(255,217,90,.28),transparent 60%),linear-gradient(180deg,var(--card),var(--card2))}
.q-head{display:flex;align-items:center;gap:12px}
.q-ic{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#FFEA94,#FFC83A);color:#272044;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #DB9C00}
.q-ic .ic{width:27px;height:27px}
.q-title{font-family:var(--f-d);font-size:23px}
.q-sub{font-size:13.5px;color:var(--ink2);font-weight:800}
.q-tag{margin-left:auto;background:var(--mint);color:#14724A;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;align-self:flex-start}
.q-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
.q-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.q-gi{width:100%;max-width:58px;aspect-ratio:1;border-radius:17px;display:grid;place-items:center;font-size:25px;background:var(--soft);box-shadow:inset 0 -3px 0 rgba(39,32,68,.08)}
.q-step.done .q-gi{background:linear-gradient(180deg,#8CF0C4,#2FC584);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 #1A925C}
.q-step.done .q-gi .ic{width:27px;height:27px;stroke-width:3.2}
.q-step.cur .q-gi{background:linear-gradient(180deg,#FFF4C7,#FFE07A);box-shadow:0 0 0 3px #FFC83A;animation:curp 1.6s ease-in-out infinite}
.q-step small{font-size:11px;font-weight:900;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.q-meta{display:flex;justify-content:space-between;font-size:13.5px;font-weight:900;color:var(--ink2);margin:8px 2px 12px}
.q-meta span{display:inline-flex;align-items:center;gap:5px}
.q-rewards{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.rlabel{font-size:13px;font-weight:900;color:var(--ink2);margin-right:2px}
.rw{display:inline-flex;align-items:center;gap:4px;background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px 4px 6px;font-weight:900;font-size:14px;box-shadow:0 2px 8px rgba(39,32,68,.1)}
.rw .icc{width:19px;height:19px}
.rw.xp{background:linear-gradient(180deg,#CFC1FF,#8F74FF);color:#fff;padding-left:10px}
.q-done{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;margin-bottom:12px;font-size:16px}
.q-done .icc{width:28px;height:28px}

/* ---------- world cards ---------- */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.wgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wcard{position:relative;border-radius:24px;background:var(--card);box-shadow:var(--hi),var(--sh1);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s;text-align:left}
.wcard:active{transform:scale(.97)}
.wart{position:relative;aspect-ratio:16/10;background:var(--wc);overflow:hidden}
.wart>svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s}
.wcard:hover .wart>svg{transform:scale(1.05)}
.wbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;border-top:4px solid var(--wc)}
.wname{font-family:var(--f-d);font-size:18px;line-height:1.1}
.wdesc{font-size:12.5px;font-weight:800;color:var(--ink2)}
.wprog{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
.wprog .bar{flex:1;height:8px}
.wprog .bar i{background:linear-gradient(180deg,#FFEA94,#FFC83A)}
.wprog .icc{width:15px;height:15px}
.wprog span{display:inline-flex;align-items:center;gap:2px}
.wfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:2px}
.lvtag{background:color-mix(in srgb,var(--wc,#BFA7FF) 45%,#fff);color:var(--wd,#5236C9);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.wplay{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--wd) 65%,#fff),var(--wd));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--wd) 70%,#000);transition:transform .12s}
.wplay:active{transform:scale(.9)}
.wplay .ic{width:18px;height:18px;margin-left:2px}
.wcard.locked .wart>svg{filter:grayscale(.9) brightness(1.08);opacity:.55}
.wcard.locked .wname{opacity:.75}
.wlock{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;color:#272044;font-weight:900;font-size:13px}
.wlock .ic{width:30px;height:30px;background:#fff;border-radius:50%;padding:8px;box-sizing:content-box;box-shadow:0 4px 10px rgba(39,32,68,.2)}

/* ---------- missions & weekly ---------- */
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-child{border-top:0}
.m-ic{width:46px;height:46px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:23px;flex:none}
.m-body{flex:1;min-width:0;font-weight:800;font-size:15px}
.m-done{color:#2FC584}.m-done .ic{width:26px;height:26px;stroke-width:3}
.weekly{display:flex;align-items:center;gap:14px;border-radius:var(--r2);padding:16px;margin:16px 0;color:#fff;background:radial-gradient(90% 90% at 15% 0%,rgba(255,255,255,.35),transparent 55%),linear-gradient(160deg,#8EC9FF,#7B5CFF);box-shadow:var(--sh2)}
.weekly .wi{font-size:46px;filter:drop-shadow(0 4px 4px rgba(39,32,68,.25))}
.wk-t{font-size:13px;font-weight:900;opacity:.92}
.wk-n{font-family:var(--f-d);font-size:21px;line-height:1.1;text-shadow:0 2px 4px rgba(39,32,68,.2)}
.wk-s{font-size:13px;font-weight:800;opacity:.96;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wk-s .icc{width:16px;height:16px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 -8px 30px rgba(39,32,68,.12);border-radius:26px 26px 0 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{background:rgba(36,29,74,.92)}}
:root[data-theme="dark"] .nav{background:rgba(36,29,74,.92)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:17px;color:var(--ink2);font-weight:900;font-size:12px;transition:background .25s,color .25s,transform .12s;min-width:0}
.nav button:active{transform:scale(.92)}
.nav button .ic{width:26px;height:26px}
.nav button.on{color:#fff;background:linear-gradient(180deg,#A08BFF,#6E50F0);box-shadow:0 4px 12px rgba(110,80,240,.35)}
.nav button.on .ic{animation:navpop .4s cubic-bezier(.3,1.6,.5,1)}
.nav .nvl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- sheets, toasts, dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(39,32,68,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:30px 30px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:sheetup .38s cubic-bezier(.2,1.1,.4,1);box-shadow:0 -10px 40px rgba(39,32,68,.25)}
.sheet h2{font-size:26px;margin-bottom:6px}
.sheet .btn.block{margin-top:10px}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:30px}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#272044;color:#fff;padding:11px 18px;border-radius:999px;font-weight:900;z-index:300;box-shadow:0 12px 30px rgba(39,32,68,.35);animation:drop .45s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:310;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
.gate-ic{width:64px;height:64px;margin:0 auto 6px;border-radius:22px;display:grid;place-items:center;background:var(--soft);color:var(--brand)}
.gate-ic .ic{width:32px;height:32px}
.gate-q{font-family:var(--f-d);font-size:24px;margin:8px 0}
.gate-in{max-width:200px;margin:10px auto 0;font-size:28px;font-family:var(--f-d);min-height:56px;text-align:center}

/* ---------- celebration ---------- */
.celeb{position:fixed;inset:0;z-index:250;display:grid;place-items:center;background:rgba(39,32,68,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s;overflow:hidden;padding:24px}
.rays{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.25) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spinr 20s linear infinite;-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
.celeb-in{position:relative;background:linear-gradient(180deg,#fff,#F6F2FF);color:#272044;border-radius:32px;padding:20px 20px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:celebin .6s cubic-bezier(.2,1.4,.4,1)}
.celeb-in h2{font-size:34px;margin:4px 0 6px}
.celeb-in p{margin:0 0 14px;font-weight:800;color:#5E5888;font-size:16px}
.celeb-buddy{width:150px;margin:-78px auto 0}
.celeb-buddy.sm{width:120px;margin:0 auto}
.celeb-art{margin:4px 0 12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cw{width:120px;aspect-ratio:16/10;border-radius:16px;overflow:hidden;box-shadow:0 6px 14px rgba(39,32,68,.2)}
.cw svg{width:100%;height:100%;display:block}
.bigstk{width:110px;height:110px;border-radius:30px;display:grid;place-items:center;font-size:58px;margin:0 auto;background:linear-gradient(180deg,#FFF6D8,#FFE38A);box-shadow:0 6px 0 #E8B93A,0 14px 24px rgba(39,32,68,.2);animation:popc .6s}

/* ---------- adventure map ---------- */
.cmap{position:relative;margin:8px 0 10px}
.cmap>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cmap .flow{animation:flow 1s linear infinite}
.node{position:absolute;display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;width:calc(72% + 50px);color:var(--ink);text-align:left}
.node.l{left:calc(26% - 50px)}
.node.r{right:calc(26% - 50px);flex-direction:row-reverse;text-align:right}
.isl{position:relative;width:100px;height:100px;flex:none;animation:float 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.55s)}
.isl>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lm{position:absolute;left:50%;top:-8px;width:60px;height:60px;margin-left:-30px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 6px 12px rgba(39,32,68,.25)}
.lm svg{width:100%;height:100%;display:block}
.nl{background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:var(--hi),var(--sh1);min-width:0}
.nl b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;line-height:1.15}
.nl small{color:var(--ink2);font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.nl .icc,.nl .ic{width:14px;height:14px}
.node.locked .isl{filter:grayscale(.85);opacity:.7}
.node.locked .nl{opacity:.82}
.node:active .isl{transform:scale(.95)}

/* ---------- world page ---------- */
.wbanner{position:relative;border-radius:var(--r1);overflow:hidden;margin:12px 0;box-shadow:var(--sh2);background:var(--card)}
.wb-art{aspect-ratio:16/8;position:relative;background:var(--wc)}
.wb-art svg{position:absolute;inset:0;width:100%;height:100%}
.wb-info{padding:14px 16px 16px;border-top:5px solid var(--wc)}
.wb-info h1{font-size:30px}
.wb-info p{margin:2px 0 10px;color:var(--ink2);font-weight:800}
.wb-stats{display:flex;gap:8px;flex-wrap:wrap}
.wpath>svg{width:100%;height:auto;display:block;overflow:visible}
.wpath .pulse{animation:nodep 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;cursor:pointer}
.wgames{display:flex;flex-direction:column;gap:10px}
.wgame{display:flex;align-items:center;gap:12px;margin:0;padding:12px}
.gtile{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-size:30px;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--wc) 55%,#fff),var(--wc));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.08)}
.gi{flex:1;min-width:0}
.gi b{font-family:var(--f-d);font-weight:400;font-size:18px;display:block}
.gi small{display:block;color:var(--ink2);font-weight:700;font-size:13px;line-height:1.3}
.gmeta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;font-weight:900;color:var(--ink2);flex-wrap:wrap}
.stars3{display:inline-flex;gap:1px}
.stars3 .icc{width:16px;height:16px}
.stars3 .dim{filter:grayscale(1);opacity:.28}
.stk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px;font-size:30px;background:var(--soft);color:var(--ink2);font-family:var(--f-d);border:2px dashed rgba(39,32,68,.15)}
.stk small{font-family:var(--f-u);font-size:11px;font-weight:900}
.stk.got{background:linear-gradient(180deg,#FFF6D8,#FFE38A);border:0;color:#272044;box-shadow:0 4px 0 #E8B93A;animation:popc .5s}

/* ---------- progress ---------- */
.phero{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.lvring{width:100px;height:100px}
.lvring svg{width:100%;height:100%;display:block}
.lvring .arc{animation:ringin 1.4s cubic-bezier(.3,1,.4,1) backwards}
.ph-l b{font-family:var(--f-d);font-weight:400;font-size:26px;display:block}
.ph-l .xptxt{display:block;margin:2px 0 8px}
.pstat-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pst{background:var(--soft);border-radius:16px;padding:10px 4px;text-align:center}
.pst b{display:block;font-family:var(--f-d);font-weight:400;font-size:22px}
.pst small{font-size:11px;font-weight:900;color:var(--ink2)}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.ptiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ptile{border-radius:22px;background:var(--card);box-shadow:var(--hi),var(--sh1);overflow:hidden}
.pt-art{height:74px;position:relative;background:var(--wc)}
.pt-art svg{position:absolute;inset:0;width:100%;height:100%}
.pt-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px}
.pt-body b{font-family:var(--f-d);font-weight:400;font-size:18px}
.pt-num{font-family:var(--f-d);font-size:28px;line-height:1}
.pt-num small{font-family:var(--f-u);font-size:13px;font-weight:800;color:var(--ink2)}
.pt-body .bar i{background:linear-gradient(180deg,color-mix(in srgb,var(--wd) 50%,#fff),var(--wd))}
.pt-body>small{font-size:12px;font-weight:800;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
@media(min-width:600px){.badges{grid-template-columns:repeat(6,1fr)}}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.badge b{font-size:12px;font-weight:900;line-height:1.15}
.badge small{font-size:10.5px;color:var(--ink2);font-weight:700;line-height:1.2}
.medal{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 28%,#fff 0,var(--mc) 58%,color-mix(in srgb,var(--mc) 72%,#272044) 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 0 0 4px #fff,0 6px 14px rgba(39,32,68,.2)}
.medal.lock{background:var(--soft);box-shadow:inset 0 0 0 2px rgba(39,32,68,.08)}
.medal.lock .ic{width:24px;height:24px;color:var(--ink2);opacity:.6}
.medal.big{width:116px;height:116px;font-size:56px;margin:0 auto;animation:popc .6s}
.chart{width:100%;height:auto;display:block;color:var(--ink)}
.chart .cbar{animation:growy .9s cubic-bezier(.3,1.3,.5,1) backwards;transform-box:fill-box;transform-origin:bottom}
.insight{padding:10px 12px;background:var(--soft);border-radius:14px;margin:8px 0;font-weight:800;font-size:14.5px}
.empty{text-align:center;padding:18px 12px}
.empty .eb{width:130px;margin:0 auto 6px}
.empty h2{font-size:24px;margin-bottom:6px}
.empty p{color:var(--ink2);font-weight:800;margin-bottom:14px}
.radar{width:100%;max-width:340px;display:block;margin:0 auto}
.radar .poly{transform-box:view-box;transform-origin:160px 160px;animation:grow 1s cubic-bezier(.3,1.35,.5,1) backwards}

/* ---------- buddy page ---------- */
.room{position:relative;border-radius:var(--r1);padding:16px;overflow:hidden;text-align:center;color:#fff;margin:12px 0;box-shadow:var(--sh2)}
.rm-top{display:flex;align-items:flex-start;justify-content:space-between;text-align:left;gap:8px;position:relative;z-index:1}
.rm-top h1{font-size:34px;color:#fff;text-shadow:0 2px 0 rgba(39,32,68,.35),0 0 14px rgba(39,32,68,.45)}
.room .buddy-wrap{width:min(230px,62vw);margin:4px auto 0;position:relative;cursor:pointer;z-index:1;touch-action:manipulation}
.room .bubble{display:inline-block;position:relative;z-index:1;margin-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:6px}
.mrow span{display:inline-flex;gap:6px;align-items:center}
.mrow .ic{color:#FF5FA2}
.bar.happy i{background:linear-gradient(180deg,#FFB3CF,#FF5FA2)}
.evo{display:flex;align-items:center;margin:16px 0 6px}
.evo-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.evo-step span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:var(--f-d);color:var(--ink2);font-size:17px}
.evo-step small{font-size:11.5px;font-weight:900;color:var(--ink2)}
.evo-step.on span{background:linear-gradient(180deg,#8CF0C4,#2FC584);color:#fff}
.evo-step.cur span{background:linear-gradient(180deg,#FFEA94,#FFC83A);color:#272044;box-shadow:0 0 0 4px rgba(255,200,58,.35)}
.evo-line{flex:1;height:5px;border-radius:9px;background:var(--soft);margin:0 4px 20px}
.evo-line.on{background:#2FC584}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:18px;box-shadow:var(--hi),var(--sh1);margin:0 0 12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 13px;border-radius:14px;font-weight:900;cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:14px;scroll-snap-align:start}
.tabs button.on{background:linear-gradient(180deg,#A08BFF,#6E50F0);color:#fff;box-shadow:0 3px 10px rgba(110,80,240,.35)}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:600px){.shop{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{background:var(--card);border-radius:20px;padding:10px 6px;text-align:center;box-shadow:var(--hi),var(--sh1);border:3px solid transparent;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s}
.item:active{transform:scale(.95)}
.item b{font-size:13.5px;font-weight:900;line-height:1.15}
.item small{display:inline-flex;align-items:center;gap:3px;color:var(--ink2);font-weight:900;font-size:12px}
.item small .icc{width:15px;height:15px}
.item .ie{font-size:40px;line-height:1.25}
.item .mb{width:min(84px,100%)}
.item.on{border-color:#FFC83A;background:linear-gradient(180deg,#FFFBEA,#FFF1BF)}
.item.on b,.item.on small{color:#272044}
.item.cant{opacity:.62}
.item.lockd .mb{filter:grayscale(1);opacity:.55}
.moveic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--soft);font-size:32px;margin:6px 0}
.room-sw{height:50px;width:100%;border-radius:12px;margin-bottom:6px}

/* ---------- parents ---------- */
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat div{background:var(--soft);border-radius:16px;padding:12px}
.stat b{font-family:var(--f-d);font-weight:400;font-size:28px;display:block;line-height:1.1}
.stat small{color:var(--ink2);font-weight:800}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.toggle:first-of-type{border-top:0}
.tg-l{display:flex;gap:10px;align-items:flex-start}
.tg-l>.ic{width:22px;height:22px;margin-top:2px;color:var(--brand)}
.sw{width:54px;height:32px;border-radius:999px;background:#D9D4EC;border:0;position:relative;cursor:pointer;flex:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);transition:background .2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on{background:#2FC584}
.sw.on::after{left:26px}
.skrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:800;font-size:14px}
.skrow .bar,.skrow .m-bar{flex:1;margin:0}
.inp{font:inherit;font-size:17px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink);width:100%;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:12px auto 0}
.keypad button{padding:12px;font-size:22px;border-radius:16px;border:0;cursor:pointer;font-family:var(--f-d);background:linear-gradient(180deg,#fff,#F1EDFF);color:#272044;box-shadow:inset 0 2px 0 #fff,0 4px 0 #D7CFF5}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #D7CFF5}
.segp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.segp button{border:0;background:var(--soft);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer}
.segp button.on{background:linear-gradient(180deg,#A08BFF,#6E50F0);color:#fff}
.kidrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kidrow:first-child{border-top:0}
.kidrow .avatar{width:48px;height:48px;font-size:27px;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(39,32,68,.15);cursor:default}
.kn{flex:1;min-width:0}
.kn b{display:block;font-size:16px}
.kn small{color:var(--ink2);font-weight:800}
.nowtag{background:var(--mint);color:#14724A;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.iconbtn.sm{width:38px;height:38px;border-radius:12px}
.iconbtn.sm .ic{width:19px;height:19px}

/* ---------- onboarding & who's playing ---------- */
.onb{position:fixed;inset:0;z-index:90;overflow:auto;color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));background:radial-gradient(180px 180px at 15% 20%,rgba(255,255,255,.3),transparent 70%),radial-gradient(140px 140px at 85% 60%,rgba(255,200,240,.35),transparent 70%),linear-gradient(170deg,#9EC9FF,#8F74FF 55%,#C27BF0)}
.onb-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.onb-in>*{width:100%}
.onb-in>.btn{width:auto}
.onb h1{font-size:40px;text-shadow:0 3px 0 rgba(39,32,68,.2)}
.onb h2{font-size:30px;text-shadow:0 2px 0 rgba(39,32,68,.15)}
.onb .logo{justify-content:center}
.onb .lg-name{color:#fff;text-shadow:0 2px 0 rgba(39,32,68,.2);font-size:32px}
.onb .tagline{font-size:20px;font-weight:900}
.white-card{background:#fff;color:#272044;border-radius:24px;padding:16px;width:100%;max-width:480px;margin:0 auto;box-shadow:0 10px 30px rgba(39,32,68,.2)}
.white-card .note{color:#5E5888}
.white-card .inp{background:#fff;color:#272044;border-color:rgba(39,32,68,.14)}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick{border:3px solid transparent;background:linear-gradient(180deg,#fff,#F1EDFF);color:#272044;border-radius:20px;padding:10px 4px;cursor:pointer;font-size:34px;font-weight:900;box-shadow:0 5px 0 rgba(39,32,68,.15);transition:transform .12s}
.pick:active{transform:scale(.95)}
.pick small{display:block;font-size:13px;line-height:1.2}
.pick.on{border-color:#FFC83A;background:linear-gradient(180deg,#FFF8D2,#FFE98A)}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ages .pick{font-size:22px;padding:8px 0;font-family:var(--f-d);font-weight:400}
.onb-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.who .kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.kidbtn{border:0;background:rgba(255,255,255,.94);color:#272044;border-radius:24px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:900;font-size:18px;box-shadow:0 6px 0 rgba(39,32,68,.15);transition:transform .12s}
.kidbtn:active{transform:scale(.95)}
.avatar.big{width:86px;height:86px;font-size:48px}

/* ---------- avatar picker ---------- */
.avp{display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.onb .avp,.white-card .avp{color:#272044}
.avp-prev{width:110px;height:110px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:60px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15),0 0 0 5px #fff,0 10px 22px rgba(39,32,68,.25);animation:popc .4s}
.avp .tabs{margin:0}
.onb .avp .tabs{background:#F4F1FF;box-shadow:none}
.onb .avp .tabs button{color:#5E5888}.onb .avp .tabs button.on{color:#fff}
.avtones,.avbgs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.avtone{border:0;background:#F1EDFF;border-radius:14px;width:44px;height:44px;font-size:24px;cursor:pointer}
.avtone.on{background:#FFF6C2;box-shadow:0 0 0 3px #FFC83A}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:430px){.avgrid{grid-template-columns:repeat(5,1fr)}}
.avgrid button{border:0;aspect-ratio:1;border-radius:16px;background:#F4F1FF;font-size:clamp(24px,7vw,32px);cursor:pointer;display:grid;place-items:center;transition:transform .12s;touch-action:manipulation}
.avgrid button.on{background:#FFF6C2;box-shadow:0 0 0 3px #FFC83A;transform:scale(1.07)}
.avbgs{gap:6px;flex-wrap:nowrap}
.avbgs button{flex:none;width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15)}
.avbgs button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #7B5CFF}
.avlbl{font-weight:900;font-size:14px;text-align:center;opacity:.75;margin-bottom:-4px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:radial-gradient(160px 160px at 20% 25%,rgba(255,255,255,.4),transparent 70%),linear-gradient(170deg,#B9E5FF,#BFA7FF);transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-in .mark{width:104px;height:104px;animation:bloom 1.4s ease-in-out infinite}
.sp-name{font-family:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;font-size:34px;color:#272044}
.sp-dots{display:flex;gap:7px}
.sp-dots i{width:11px;height:11px;border-radius:50%;background:#fff;animation:dot 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}.sp-dots i:nth-child(3){animation-delay:.3s}

/* =========================================================
   GAME SCREENS
   ========================================================= */
.game{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));overflow:hidden;background:radial-gradient(130% 65% at 50% -8%,rgba(255,255,255,.45),transparent 55%),radial-gradient(170% 120% at 50% 45%,transparent 52%,rgba(20,5,60,.35)),linear-gradient(180deg,var(--gc),color-mix(in srgb,var(--gc) 68%,#170A3A))}
.g-top{display:flex;align-items:center;gap:8px;max-width:720px;width:100%;margin:0 auto}
.g-ic{width:44px;height:44px;border:0;border-radius:15px;background:linear-gradient(180deg,#fff,#EEEAFB);color:#272044;cursor:pointer;display:grid;place-items:center;flex:none;position:relative;box-shadow:inset 0 2px 0 #fff,0 4px 0 rgba(20,10,60,.25),0 8px 14px rgba(20,10,60,.2)}
.g-ic .ic{width:22px;height:22px}
.g-ic:active{transform:translateY(3px)}
.g-title{flex:1;font-family:var(--f-d);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(20,5,60,.25)}
.g-lvl{background:rgba(255,255,255,.92);color:#272044;border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 4px 12px rgba(20,10,60,.18)}
.g-hint b{position:absolute;top:-6px;right:-6px;background:#FFD43B;color:#272044;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.g-hint.off{opacity:.4;pointer-events:none}
.g-hint.pulse{animation:wig .9s ease-in-out infinite;background:linear-gradient(180deg,#FFF0A0,#FFC21A)}
.g-say.on{background:linear-gradient(180deg,#FFF0A0,#FFC21A);animation:sayp 1s ease-in-out infinite}
.g-prog{max-width:720px;width:100%;margin:10px auto 0;height:12px;border-radius:9px;background:rgba(255,255,255,.28);box-shadow:inset 0 2px 4px rgba(20,10,60,.25);overflow:hidden;flex:none}
.g-prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(180deg,#FFF0A0,#FFC21A);box-shadow:inset 0 2px 0 rgba(255,255,255,.6);transition:width .3s}
.g-body{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:14px 2px 104px;display:flex;flex-direction:column}
.g-flash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) perspective(500px) rotateX(75deg) scale(.6);background:#fff;color:#272044;font-family:var(--f-d);font-size:24px;padding:14px 24px;border-radius:24px;opacity:0;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.2);transition:all .22s;text-align:center;max-width:86%;z-index:6}
.g-flash.show{opacity:1;transform:translate(-50%,-50%) perspective(500px) rotateX(0) scale(1)}
.q{font-family:var(--f-d);font-size:25px;text-align:center;margin:4px 0 14px;text-shadow:0 2px 8px rgba(20,5,60,.35);line-height:1.15}
.prompt{margin-bottom:12px}
.emoji-wall,.seq span,.eq,.story-q,.stroop,.item-card,.twins div,.shapeq,.ocard,.mz,.dpad button,.big-ic,.rule,.arrowbox,.board,.pan,.tcard,.choice{background:linear-gradient(180deg,#fff,#F3F0FF);box-shadow:inset 0 2px 0 #fff,inset 0 -4px 0 rgba(60,40,140,.08),0 6px 0 rgba(20,10,60,.2),0 14px 24px rgba(20,10,60,.22)}
.choices{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;perspective:900px}
.choice{position:relative;color:#272044;border:0;border-radius:22px;min-height:80px;font-size:38px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;transition:transform .08s,opacity .2s;touch-action:manipulation;line-height:1.1;animation:flipin .5s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.choice small{font-size:17px}
.choice:active{transform:translateY(3px)}
.choices.small{gap:6px}
.choices.small .choice{min-height:0;aspect-ratio:1;font-size:clamp(20px,6.5vw,34px);border-radius:14px;padding:0;box-shadow:inset 0 2px 0 #fff,0 3px 0 rgba(20,10,60,.2),0 6px 10px rgba(20,10,60,.18)}
.choice.txt{font-size:19px;min-height:62px;font-weight:900}
.choices.tall .choice{min-height:116px}
.choices.num .choice{font-family:var(--f-d);font-size:36px;font-weight:400}
.choices.grids .choice{padding:14px}
.choice.right{background:linear-gradient(180deg,#D8FFE8,#86F0B6);box-shadow:inset 0 2px 0 #fff,0 0 0 3px #2FCB73,0 6px 0 #1A8A4B,0 0 30px rgba(47,203,115,.6);animation:spin3d .65s cubic-bezier(.3,1.4,.5,1)}
.choice.wrong{background:linear-gradient(180deg,#FFE3E8,#FFA9B8);box-shadow:inset 0 2px 0 #fff,0 0 0 3px #F0435F,0 6px 0 #B5243F;animation:shake .4s}
.choice.gone{opacity:.12;pointer-events:none}
.choice:disabled{cursor:default}
.fb{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#272044;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 40px rgba(20,10,60,.3);animation:sheet3d .4s cubic-bezier(.2,1.2,.4,1);z-index:5}
.fb-in{max-width:680px;margin:0 auto}
.fb h3{font-family:var(--f-d);font-size:25px;font-weight:400;margin-bottom:4px}
.fb p{margin:0 0 14px;font-size:18px;color:#5E5888;font-weight:700}
.fb.ok h3{color:#15803D}.fb.no h3{color:#C2410C}
.hintbox{background:linear-gradient(180deg,#FFFBE6,#FFF0B8);color:#6B4A00;border-radius:16px;padding:10px 14px;font-weight:800;margin:0 0 12px;font-size:17px;animation:up .2s;box-shadow:0 6px 0 rgba(20,10,60,.15)}
.emoji-wall{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;border-radius:26px;padding:16px;perspective:900px}
.emoji-wall span{font-size:40px;width:60px;height:60px;display:grid;place-items:center;background:#F4F1FF;border-radius:18px;animation:pop3d .5s cubic-bezier(.2,1.5,.4,1) backwards}
.emoji-wall.small span{font-size:30px;width:48px;height:48px}
.emoji-wall .hole{color:#9F97D6;font-weight:900;border:3px dashed #C9C2EE;background:none}
.memo{display:flex;flex-direction:column;gap:16px;align-items:center;margin:auto 0;width:100%}
.memo-bar,.tbar{width:100%;height:12px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;flex:none}
.tbar{height:8px;margin-bottom:12px}
.memo-bar i,.tbar i{display:block;height:100%;background:#fff;width:100%;animation:shrink linear forwards}
.tbar i{background:#FFD43B}
.target{display:inline-grid;place-items:center;background:#fff;border-radius:16px;width:56px;height:56px;font-size:36px;vertical-align:middle;margin-left:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0;perspective:900px}
.seq span{min-width:54px;height:58px;padding:0 10px;border-radius:16px;color:#272044;display:grid;place-items:center;font-size:30px;font-family:var(--f-d);animation:pop3d .5s cubic-bezier(.2,1.5,.4,1) backwards}
.seq .qm{background:rgba(255,255,255,.18);color:#fff;border:3px dashed #fff;box-shadow:none}
.eq{font-family:var(--f-d);font-size:38px;text-align:center;color:#272044;border-radius:24px;padding:16px}
.story-q{font-size:20px;color:#272044;border-radius:22px;padding:16px;line-height:1.45;font-weight:800}
.stroop{font-family:var(--f-d);font-size:58px;text-align:center;border-radius:24px;padding:20px 10px;letter-spacing:2px}
.swatch{width:60px;height:60px;border-radius:50%;display:block;box-shadow:inset -6px -8px 12px rgba(0,0,0,.28),inset 5px 5px 10px rgba(255,255,255,.55),0 4px 8px rgba(0,0,0,.2)}
.rule{text-align:center;font-size:22px;font-family:var(--f-d);color:#272044;border-radius:18px;padding:10px;margin-bottom:12px}
.rule.flip{background:linear-gradient(180deg,#FFF0A0,#FFC21A);animation:popc .5s}
.item-card{border-radius:26px;display:grid;place-items:center;padding:14px;margin:0 auto;width:140px}
.arrowbox{width:150px;height:150px;margin:0 auto;border-radius:34px;display:grid;place-items:center;font-size:84px;border:9px solid #fff}
.arrowbox.g{border-color:#2FCB73}.arrowbox.r{border-color:#F0435F}
.twins{display:flex;flex-direction:column;gap:10px}
.twins div{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;border-radius:22px;padding:12px;font-size:32px}
.mini{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:100%;max-width:96px;aspect-ratio:1;margin:auto}
.mini i{background:#EDE9FE;border-radius:4px}
.mini i.on{background:var(--gc,#7C5CFF);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.2)}
.shapeq{border-radius:24px;padding:16px;width:160px;margin:0 auto}
.shapeq .mini{max-width:128px}
.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;perspective:900px}
.ocard{position:relative;color:#272044;border:0;border-radius:22px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px;font-weight:900;min-height:110px;justify-content:center;animation:flipin .5s cubic-bezier(.2,1.3,.4,1) backwards}
.ocard .oe{font-size:42px}
.ocard .num{position:absolute;top:-9px;left:-9px;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#8BF5BB,#24B163);color:#fff;display:grid;place-items:center;font-family:var(--f-d);box-shadow:0 3px 6px rgba(0,0,0,.25)}
.ocard.placed{opacity:.6;pointer-events:none}
.ocard.glow{box-shadow:0 0 0 5px #FFD43B,0 6px 0 rgba(0,0,0,.14)}
.ocard.wrong{animation:shake .4s}
.pads{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:14px;max-width:360px;width:100%;margin:10px auto}
.pad{aspect-ratio:1;border:0;border-radius:32px;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -10px 0 rgba(0,0,0,.2),0 10px 20px rgba(20,10,60,.3);opacity:.72;transition:transform .1s,opacity .1s,filter .1s;font-size:34px}
.pad.lit{opacity:1;transform:perspective(400px) translateZ(30px) scale(1.04);filter:brightness(1.25) saturate(1.2);box-shadow:0 0 0 6px #fff,0 0 30px #fff}
.pads.off .pad{pointer-events:none}
.status{text-align:center;font-family:var(--f-d);font-size:24px;margin:4px 0}
.scoreline{text-align:center;font-size:19px;font-weight:900}
.stage{width:min(68vw,260px);aspect-ratio:1;border-radius:50%;border:0;margin:14px auto;background:radial-gradient(circle at 38% 30%,#fff,#ECE7FF 60%,#CFC6F5);display:grid;place-items:center;font-size:110px;box-shadow:inset 0 -10px 20px rgba(60,40,140,.15),0 16px 30px rgba(20,10,60,.3);cursor:pointer;transition:transform .1s;touch-action:manipulation}
.stage:active{transform:scale(.96)}
.stage.hit{background:radial-gradient(circle,#DCFCE7,#86EFAC);animation:spin3d .5s}
.stage.oops{background:radial-gradient(circle,#FFE4E6,#FDA4AF);animation:spin3d .5s}
.stage .it{display:inline-block}
.stage .it.in{animation:pop3d .35s cubic-bezier(.2,1.5,.4,1)}
.mz{display:grid;grid-template-columns:repeat(var(--w),1fr);width:min(100%,400px);aspect-ratio:1;margin:8px auto;border-radius:18px;padding:8px;touch-action:none;flex:none}
.mz div{border:0 solid #4C3BA8;display:grid;place-items:center;font-size:var(--fs,20px);line-height:1;min-width:0;overflow:hidden}
.mz .wn{border-top-width:3px}.mz .we{border-right-width:3px}.mz .ws{border-bottom-width:3px}.mz .ww{border-left-width:3px}
.mz .trail{background:#EDE9FE}.mz .hintc{background:#FDE68A}
.dpad{display:grid;grid-template-columns:repeat(3,66px);grid-auto-rows:56px;gap:8px;justify-content:center;margin-top:8px}
.dpad button{border:0;border-radius:18px;font-size:28px;cursor:pointer;touch-action:manipulation}
.dpad button:active{transform:translateY(3px)}
.intro,.results{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.big-ic{width:120px;height:120px;border-radius:38px;display:grid;place-items:center;font-size:66px;animation:introspin .85s cubic-bezier(.3,1.4,.5,1) backwards,bob 2.6s .85s ease-in-out infinite}
.intro h2,.results h2{font-size:34px;text-shadow:0 3px 8px rgba(20,5,60,.3)}
.intro p{font-size:19px;max-width:420px;margin:0;font-weight:800;opacity:.97}
.tag{background:rgba(255,255,255,.92);color:#272044;border-radius:999px;padding:5px 14px;font-weight:900;box-shadow:0 4px 12px rgba(20,10,60,.18)}
.seg{display:inline-flex;background:rgba(255,255,255,.25);border-radius:16px;padding:4px}
.seg button{border:0;background:none;color:#fff;font-weight:900;padding:8px 14px;border-radius:12px;cursor:pointer;font-size:16px}
.seg button.on{background:#fff;color:#272044}
.starsrow{display:flex;gap:6px;justify-content:center}
.starsrow span{display:inline-block;animation:star3d .8s cubic-bezier(.3,1.5,.5,1) backwards}
.starsrow .icc{width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(20,5,60,.3))}
.starsrow span.dim{filter:grayscale(1);opacity:.35}
.rewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rewards span{background:#fff;color:#272044;border-radius:999px;padding:7px 14px;font-weight:900;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 0 rgba(20,10,60,.15);animation:pop3d .5s cubic-bezier(.2,1.5,.4,1) backwards}
.rewards span:nth-child(2){animation-delay:.08s}.rewards span:nth-child(3){animation-delay:.16s}
.rewards .icc{width:20px;height:20px}
.msg{background:rgba(255,255,255,.92);color:#272044;border-radius:16px;padding:8px 14px;font-weight:800;max-width:440px;box-shadow:0 4px 12px rgba(20,10,60,.18)}
.res-bud{width:120px}
/* game companion */
.gb{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:84px;z-index:4;pointer-events:none;transition:opacity .2s}
.gb.hide{opacity:0}
.gb .gbs{transform-origin:50% 95%}
.gb.cheer .gbs{animation:gbcheer .7s cubic-bezier(.3,1.5,.5,1)}
.gb.party .gbs{animation:jump3d .9s cubic-bezier(.3,1.3,.5,1)}
.gb.sad .gbs{animation:gbsad .8s ease-in-out}
.gb .gbb{position:absolute;left:86px;bottom:46px;background:#fff;color:#272044;font-weight:900;font-size:15px;padding:8px 12px;border-radius:16px;white-space:nowrap;box-shadow:0 8px 20px rgba(20,10,60,.25);opacity:0;transform:scale(.6) translateY(8px);transform-origin:0 100%;transition:all .22s cubic-bezier(.3,1.4,.5,1)}
.gb .gbb::before{content:'';position:absolute;left:-7px;bottom:10px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.gb .gbb.show{opacity:1;transform:none}
/* word / math / puzzle game parts */
.board{border-radius:24px;padding:14px;max-width:300px;width:100%;margin:0 auto}
.board svg{display:block;width:100%;height:auto;max-height:230px}
.pgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;width:100%;max-width:var(--mx,240px);aspect-ratio:1;margin:0 auto}
.pgrid i{border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18)}
.pgrid i.hole{background:repeating-linear-gradient(45deg,#EDE9FE 0 6px,#fff 6px 12px)!important;box-shadow:inset 0 0 0 2.5px #8B5CF6;animation:holep 1.4s ease-in-out infinite}
.choices.grids .pgrid{--mx:96px}
.scale{max-width:380px;width:100%;margin:6px auto 0}
.pans{display:flex;gap:14px;align-items:flex-end}
.pan{flex:1;color:#272044;border-radius:22px;padding:16px 6px;text-align:center;font-size:34px;font-family:var(--f-d);white-space:nowrap}
.pan b{color:#8B5CF6;font-weight:400}
.scale svg{display:block;width:100%;height:auto;margin-top:-4px}
.tnum{display:inline-grid;place-items:center;min-width:64px;height:56px;padding:0 12px;border-radius:18px;background:linear-gradient(180deg,#FFF0A0,#FFC21A);color:#4A2B00;font-size:32px;vertical-align:middle;margin-left:4px;box-shadow:0 4px 0 #D98A00;font-family:var(--f-d)}
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;width:100%;margin:0 auto}
.tcard{border:0;border-radius:22px;min-height:86px;font-size:38px;font-family:var(--f-d);color:#272044;cursor:pointer;transition:transform .12s,box-shadow .12s;touch-action:manipulation;animation:flipin .5s cubic-bezier(.2,1.3,.4,1) backwards}
.tcard.sel{background:linear-gradient(180deg,#FFF6C2,#FFD84A);transform:translateY(-6px);box-shadow:inset 0 2px 0 #fff,0 10px 0 #D98A00,0 16px 24px rgba(20,10,60,.25)}
.tcard.glow{box-shadow:0 0 0 5px #FFD43B,0 6px 0 rgba(20,10,60,.2)}
.tcard.good{background:linear-gradient(180deg,#D8FFE8,#86F0B6);box-shadow:0 0 0 3px #2FCB73,0 6px 0 #1A8A4B}
.tcard.bad{background:linear-gradient(180deg,#FFE3E8,#FFA9B8)}
.tcard:disabled{cursor:default}
.tsum{min-height:28px;margin-top:12px}
.choice.txt,.story-q{font-family:var(--f-u)}

/* =========================================================
   BUDDY ANIMATION
   ========================================================= */
.buddy-svg{width:100%;height:auto;display:block;overflow:visible}
.buddy-svg .bodyg{transform-box:view-box;transform-origin:60px 108px;animation:hop 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.buddy-svg .shd{transform-box:view-box;transform-origin:60px 112px;animation:shd 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.buddy-svg .bk{transform-box:view-box;transform-origin:60px 70px;animation:sway 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.buddy-svg .eyes{transform-box:view-box;transform-origin:60px 64px;animation:blink 5.2s infinite;animation-delay:var(--d,0s)}
.buddy-svg .pup{transition:transform .18s ease-out}
.buddy-svg .bulb{animation:glow 1.4s ease-in-out infinite}
.buddy-svg .aura{transform-box:view-box;transform-origin:60px 64px;animation:pulse3 2.4s ease-in-out infinite}
.buddy-svg.still *{animation:none!important}
.buddy-svg.jump,.buddy-svg.mv-spin{animation:jump3d .9s cubic-bezier(.3,1.3,.5,1)}
.buddy-svg.mv-dance{animation:dance 1s ease-in-out;transform-origin:50% 90%}
.buddy-svg.mv-wiggle{animation:wiggle .9s ease-in-out;transform-origin:50% 95%}
.buddy-svg.mv-flip{animation:flip 1s cubic-bezier(.3,1.2,.5,1);transform-origin:50% 60%}
.buddy-svg.mv-rocket{animation:rocket 1.3s cubic-bezier(.3,1.1,.5,1)}
.float{position:absolute;left:50%;top:45%;font-size:34px;pointer-events:none;animation:floatup 1.2s ease-out forwards;z-index:3}
.tilt{transition:transform .25s ease-out;will-change:transform}
#app.enter>*{animation:rise .55s cubic-bezier(.2,1.25,.4,1) backwards}
#app.enter>*:nth-child(2){animation-delay:50ms}#app.enter>*:nth-child(3){animation-delay:100ms}#app.enter>*:nth-child(4){animation-delay:150ms}#app.enter>*:nth-child(5){animation-delay:200ms}#app.enter>*:nth-child(6){animation-delay:250ms}#app.enter>*:nth-child(7){animation-delay:300ms}#app.enter>*:nth-child(8){animation-delay:350ms}#app.enter>*:nth-child(n+9){animation-delay:400ms}
.wgrid>*:nth-child(2){animation-delay:60ms}

/* ---------- keyframes ---------- */
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@keyframes popc{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes shrink{to{width:0}}
@keyframes flipin{from{opacity:0;transform:rotateX(-85deg) translateY(24px)}}
@keyframes spin3d{0%{transform:rotateY(0) scale(1)}60%{transform:rotateY(360deg) scale(1.12)}100%{transform:rotateY(360deg) scale(1)}}

function finishGame(id,ctx,secs){const g=G[id];const acc=ctx.total?ctx.correct/ctx.total:0;
 const prev=S.log.filter(x=>x.g===id).slice(-5);const prevAvg=prev.length?avg(prev.map(x=>x.a)):null;const prt=prev.filter(x=>x.rt).map(x=>x.rt);const prevRt=prt.length?avg(prt):0;
 const prevBest=S.best[id];const prevLen=S.best[id+'_len']||0;const lvBefore=lvlInfo().L;
 S.levels[id]=ctx.L;S.plays[id]=(S.plays[id]||0)+1;S.best[id]=Math.max(prevBest||0,acc);

 S.skillPts[g.skill]=(S.skillPts[g.skill]||0)+ctx.correct*(1+ctx.L*.3)+1;
 const coins=5+ctx.correct*2,xp=10+ctx.correct*10+ctx.L*3,stars=acc>=.9?3:acc>=.6?2:1;S.coins+=coins;S.xp+=xp;S.stars+=stars;
 const k=todayKey();S.log.push({d:k,g:id,s:g.skill,a:Math.round(acc*100)/100,l:ctx.L,t:Math.round(secs),rt});if(S.log.length>900)S.log=S.log.slice(-900);
 const D=S.days[k]||(S.days[k]={secs:0,games:0});D.secs+=secs;D.games++;markDay();
 const t=T();t.games++;t.secs+=secs;if(ctx.hints===0)t.nohint=true;if(g.skill==='memory'&&(prevBest==null||acc>=prevBest))t.memBeat=true;

 const msgs=[];if(ctx.extraMsg)msgs.push(ctx.extraMsg);
 if(ctx.extra&&ctx.extra.len&&prevLen&&ctx.extra.len>prevLen)msgs.push(`You remembered ${ctx.extra.len-prevLen===1?'one more':(ctx.extra.len-prevLen)+' more'} than ever before! 🎉`);

 if(msgs.length<2)msgs.push('Your brain gets stronger with practice. 💪');
 const lvAfter=lvlInfo().L;save();
 return{id,acc,coins,xp,stars,msgs,L:ctx.L,prevAvg,correct:ctx.correct,total:ctx.total,levelUp:lvAfter>lvBefore?lvAfter:0,unlocked:AREAS.filter(a=>a.unlock>lvBefore&&a.unlock<=lvAfter)}}

const SLOTS=[['memory',['missing','echo']],['focus',['finder','stars']],['logic',['pattern','oddone']],['speed',['dash','twins','switch','clash','opposite']],['bonus',['words','story','links','bridge','scale','target','spin','maze','piece','blocks']]];

function makePlan(){const k=todayKey();if(S.plan&&S.plan.date===k)return S.plan;const prevIds=S.plan?S.plan.list.map(x=>x.g):[];
 const list=SLOTS.map(([slot,ids])=>{const sc=ids.map(id=>{const a=recentAcc(id);return{id,w:(a==null?.55:a)+(S.plays[id]||0)*.02+(prevIds.includes(id)?.45:0)+Math.random()*.3}}).sort((x,y)=>x.w-y.w);return{g:sc[0].id,slot,done:false}});

function dailyScore(P){const it=P.list.filter(x=>x.done);const acc=avg(it.map(x=>x.acc));const imp=avg(it.map(x=>x.prev==null?.6:clamp(.5+(x.acc-x.prev)*2,0,1)));const cons=clamp(streakNow()/5,.2,1);const chal=clamp(avg(it.map(x=>x.l))/10*1.2+.2,0,1);
 const parts=[['🎯 Accuracy',Math.round(acc*40),40],['📈 Improvement',Math.round(imp*20),20],['🔥 Consistency',Math.round(cons*20),20],['🧗 Challenge level',Math.round(chal*20),20]];return{total:parts.reduce((a,p)=>a+p[1],0),parts}}

/* ================= worlds, stickers, badges ================= */
const worldOf=id=>AREAS.find(a=>a.id===id);

const NODE=60;
const STICK={memory:['🦙','🧭','🏔️'],focus:['🦉','🍄','🔦'],logic:['🧪','🧲','🔬'],speed:['🏎️','⚡','🚀'],words:['📜','🪶','📚'],planning:['⚓','🗺️','🐚'],math:['🪐','🔭','🌠'],puzzles:['🧩','👑','🏰']};
function worldStats(a){const plays=S.log.filter(x=>a.games.includes(x.g));const xp=plays.reduce((s,x)=>s+10+Math.round(x.a*40),0);const stars=a.games.reduce((s,g)=>s+gameStars(g),0);const lvs=a.games.map(g=>S.levels[g]).filter(Boolean);
 return{plays:plays.length,xp,stars,max:a.games.length*3,lv:lvs.length?Math.max(...lvs):baseLevel(),node:Math.min(10,Math.floor(xp/NODE))}}
const stickerCount=()=>AREAS.reduce((s,a)=>s+(S.wclaim[a.id]||[]).filter(n=>n<10).length,0);
const WMIS=[{n:a=>`Play 3 games in ${a.n}`,goal:3,v:(a,st)=>st.plays},{n:()=>'Earn 3 stars in one game here',goal:1,v:a=>a.games.some(g=>gameStars(g)===3)?1:0},{n:()=>'Reach level 5 in a game here',goal:5,v:a=>Math.max(0,...a.games.map(g=>S.levels[g]||0))}];

const medal=(b,on,big)=>`<div class="medal ${on?'':'lock'} ${big?'big':''}" style="--mc:${b.c}">${on?b.e:ic('lock')}</div>`;
function ensureState(){if(!S.profile)return;let ch=false;if(!Array.isArray(S.ach)){S.ach=earned();ch=true}if(S.pet.stageMax==null){S.pet.stageMax=stageCalc();ch=true}if(ch)save()}
async function badgeCheck(){if(!S.profile)return;if(!Array.isArray(S.ach)){S.ach=earned();save();return}const fresh=earned().filter(id=>!S.ach.includes(id));if(!fresh.length)return;S.ach.push(...fresh);save();
 for(const id of fresh){const b=BADGES.find(x=>x.id===id);await celebrate({title:'New badge!',text:`${b.n}: ${b.d}.`,art:medal(b,true,true),btn:'Yay!',mood:'happy'})}}

async function afterProgress(){await evoCheck();await badgeCheck()}
const starsEarned=()=>S.log.reduce((s,x)=>s+(x.a>=.9?3:x.a>=.6?2:1),0);

/* ================= celebrations, gate, break ================= */
function celebrate({title,text='',art='',btn='Awesome!',mood='celebrate'}){return new Promise(res=>{sfx('win');confetti(70);
 const el=document.createElement('div');el.className='celeb';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
 el.innerHTML=`<div class="rays"></div><div class="celeb-in"><div class="celeb-buddy">${buddySVG(S.pet.id,{...buddyOpts(),mood})}</div><h2>${title}</h2>${art?`<div class="celeb-art">${art}</div>`:''}<p>${text}</p><button class="btn sun block big">${btn}</button></div>`;
 document.body.appendChild(el);if(autoRead())say(speakable(`${title} ${text}`));const b=$('button',el);b.focus({preventScroll:true});b.onclick=()=>{sfx('tap');hush();el.remove();res()}})}
function levelUpBox(r){const b=BUDDIES[S.pet.id];return celebrate({title:`Level ${r.levelUp}!`,text:r.unlocked.length?`New world unlocked: ${r.unlocked.map(a=>a.n).join(' and ')}!`:`${b.n} is so proud of you!`,art:r.unlocked.map(a=>`<div class="cw">${worldArt(a.id)}</div>`).join('')})}
function newGateQ(){return{a:rnd(3,9),b:rnd(11,19)}}
function gateBox(){return new Promise(res=>{const q=newGateQ();let v='';const s=document.createElement('div');s.className='scrim cf';
 const draw=()=>{s.innerHTML=`<div class="sheet center" role="dialog" aria-modal="true"><div class="gate-ic">${ic('lock')}</div><h2>Grown-up check</h2><p class="note">Enter the answer to:</p><div class="gate-q">${NUMW[q.a]} times ${NUMW[q.b]}</div><div class="inp gate-in">${v||'&nbsp;'}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><button class="btn ghost block cx">Cancel</button></div>`;
  $$('[data-k]',s).forEach(b=>b.onclick=()=>{const k=b.dataset.k;sfx('tap');if(k==='C')v='';else if(k==='OK'){s.remove();if(+v===q.a*q.b)res(true);else{toast('That’s not right.');res(false)}return}else if(v.length<4)v+=k;draw()});$('.cx',s).onclick=()=>{s.remove();res(false)}};
 draw();document.body.appendChild(s)})}
function timeOK(){const lim=+S.settings.limit||0;if(!lim)return true;const t=T();return t.secs/60<lim+(t.extra||0)}
function breakTime(){return new Promise(res=>{const b=BUDDIES[S.pet.id];let done=false;const fin=v=>{if(done)return;done=true;res(v)};
